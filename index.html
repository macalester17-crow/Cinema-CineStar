<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineStar Cinema</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: Arial, sans-serif;
    }

    h2 {
      color: #333;
      margin-top: 20px;
    }

    .card img {
      height: 250px;
      object-fit: cover;
    }

    footer {
      background: #212529;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CineStar</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li><a class="nav-link" href="#home">Home</a></li>
          <li><a class="nav-link" href="#movies">Now Showing</a></li>
          <li><a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#contactModal">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Carousel -->
  <div id="home" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="Avengers caro.jpeg" class="d-block w-100" alt="Avengers">
      </div>
      <div class="carousel-item">
        <img src="frozen 2 caro.jpg" class="d-block w-100" alt="Frozen 2">
      </div>
      <div class="carousel-item">
        <img src="john wick 4 caro.jpg" class="d-block w-100" alt="John Wick 4">
      </div>
    </div>
  </div>

  <!-- Now Showing Section -->
  <section id="movies" class="container my-5">
    <h2 class="text-center mb-4">Now Showing</h2>
    <div class="row" id="movieList"></div>
  </section>

  <!-- Contact Modal -->
<div class="modal fade" id="contactModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Contact Us</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="name" class="form-control mb-2" placeholder="Name">
        <input type="email" id="email" class="form-control mb-2" placeholder="Email">
        <textarea id="message" class="form-control mb-2" placeholder="Message"></textarea>
        <div class="form-check">
          <input id="consent" type="checkbox" class="form-check-input">
          <label class="form-check-label">I agree to data use.</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="validateForm()">Send</button>
      </div>
    </div>
  </div>
</div>


  <!-- Footer -->
  <footer>
    © 2025 CineStar Cinema | Made by MAC BROS
  </footer>

  <!-- Bootstrap + jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Simple movie list
    const movies = [
      { title: "Avengers: Endgame", time: "7:00 PM", img: "Avengers Endgame.jpg" },
      { title: "Frozen 2", time: "5:30 PM", img: "frozen2.jpg" },
      { title: "John Wick 4", time: "9:00 PM", img: "John Wick 4.jpg" }
    ];

    // Display all movies
const list = document.getElementById("movieList");
movies.forEach(movie => {
  list.innerHTML += `
    <div class="col-md-4 mb-3">
      <div class="card" title="${movie.title} - ${movie.time}">
        <img src="${movie.img}" class="card-img-top">
        <div class="card-body text-center">
          <h5>${movie.title}</h5>
          <p>${movie.time}</p>
        </div>
      </div>
    </div>`;
});


    // Enable tooltip
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el));

    // Form validation
    function validateForm() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();
      const consent = document.getElementById("consent").checked;

      if (!name || !email || !message) return alert("Please fill all fields!"), false;
      if (!email.includes("@")) return alert("Invalid email!"), false;
      if (!consent) return alert("Please agree to data use."), false;
      alert("Message sent successfully!");
      return true;
    }
  </script>
</body>
</html>
